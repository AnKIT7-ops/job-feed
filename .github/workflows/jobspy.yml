name: jobspy-feed
on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST daily, before the 8am pipeline run
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install python-jobspy
      - run: python jobspy_fetch.py
      - run: |
          git config user.name "jobspy-bot"; git config user.email "bot@users.noreply.github.com"
          git add jobs.json; git commit -m "jobs feed $(date -u +%F)" || echo "no change"; git push
